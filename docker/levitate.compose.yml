# Exposes Kannabi's stdio MCP server to a remote agent through Levitate.
#
#   ChatGPT -> https://<your origin>/kannabi/mcp -> Levitate -> Kannabi MCP (stdio) -> Neo4j
#
# Its own compose project, port and container name, so an existing Levitate
# instance keeps running untouched. Joins Kannabi's network to reach Neo4j by
# service name, so start the main stack first:
#
#   docker compose up -d --wait neo4j alarik
#   pnpm demo:seed                       # first run only
#   KANNABI_LEVITATE_ORIGIN=https://... docker compose -f docker/levitate.compose.yml up -d --build --wait
#
# Authentication is Levitate's own OAuth authorization server with manual
# approval, so the origin must be a public HTTPS origin that reaches this
# instance. Read the approval secret once with:
#
#   LEVITATE_LOG_APPROVAL_SECRET=1 docker compose -f docker/levitate.compose.yml logs
#
# The MCP server is read-only but reads the whole instance, ignoring per-User
# readability. Point this at a demo or evaluation database, never at data whose
# Group boundaries have to hold.
name: kannabi-levitate

services:
  levitate:
    container_name: kannabi-levitate
    build:
      context: .
      dockerfile: levitate.Dockerfile
      additional_contexts:
        # Relative to this file. The default suits a ghq checkout holding both
        # repositories side by side; override LEVITATE_SRC for any other layout.
        kannabi-src: ..
        levitate-src: ${LEVITATE_SRC:-../../levitate}
    init: true
    restart: unless-stopped
    stop_grace_period: 10s
    ports:
      - "127.0.0.1:${KANNABI_LEVITATE_PORT:-18788}:18788"
    # Supplies NEO4J_PASSWORD. NEO4J_URI is overridden below because the value
    # in .env names the host loopback, which no container can reach.
    env_file:
      - ../.env
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: neo4j
      KANNABI_LEVITATE_ORIGIN: ${KANNABI_LEVITATE_ORIGIN:?Set the public HTTPS origin that reaches this instance}
      LEVITATE_LOG_APPROVAL_SECRET: "${LEVITATE_LOG_APPROVAL_SECRET:-0}"
    volumes:
      # OAuth signing key, client store, refresh tokens and approval secret.
      - ./state:/app/state
    networks:
      - kannabi
    command:
      - /bin/sh
      - -eu
      - -c
      - |
        approval_secret_file=/app/state/approval-secret
        if [ ! -s "$${approval_secret_file}" ]; then
          umask 077
          node -e 'process.stdout.write(require("node:crypto").randomBytes(32).toString("base64") + "\n")' > "$${approval_secret_file}.tmp"
          mv "$${approval_secret_file}.tmp" "$${approval_secret_file}"
        fi
        LEVITATE_APPROVAL_SECRET="$$(cat "$${approval_secret_file}")"
        export LEVITATE_APPROVAL_SECRET
        # Levitate reads this key but never creates one, so mint it on first
        # start. Replacing it invalidates every token it has signed.
        private_key_file=/app/state/oauth-private-key.pem
        if [ ! -s "$${private_key_file}" ]; then
          umask 077
          node -e 'const {generateKeyPairSync}=require("node:crypto");
            const {privateKey}=generateKeyPairSync("rsa",{modulusLength:3072});
            process.stdout.write(privateKey.export({type:"pkcs8",format:"pem"}))' > "$${private_key_file}.tmp"
          mv "$${private_key_file}.tmp" "$${private_key_file}"
        fi
        if [ "$${LEVITATE_LOG_APPROVAL_SECRET}" = "1" ]; then
          printf '%s\n' "$${LEVITATE_APPROVAL_SECRET}"
        fi
        # Levitate serves instructions only from its own configuration and drops
        # the backend's, so an agent would otherwise never learn what Kannabi
        # does not know: https://github.com/iomz/levitate/issues/26
        # Rendering from the shipped module keeps one source of truth.
        node -e 'import("/opt/kannabi-mcp/dist/server/mcp-tools.js").then(m=>process.stdout.write(m.instructions))' \
          > /tmp/kannabi-instructions.md
        # Written at start-up because Levitate takes backend env as literal
        # strings with no interpolation: the Neo4j password would otherwise have
        # to be committed to a configuration file.
        cat > /tmp/kannabi.toml <<TOML
        [server]
        name = "kannabi"
        host = "0.0.0.0"
        port = 18788
        log_level = "info"

        [server.cors]
        allowed_origins = ["https://chatgpt.com"]

        [auth]
        mode = "levitate"

        [oauth.resource]
        enabled = true
        mode = "gateway"
        resource = "$${KANNABI_LEVITATE_ORIGIN}"
        authorization_servers = ["$${KANNABI_LEVITATE_ORIGIN}"]
        scopes_supported = ["gateway:access"]

        [oauth.as]
        enabled = true
        issuer = "$${KANNABI_LEVITATE_ORIGIN}"
        subject = "local-owner"
        approval = "manual"
        approval_secret_env = "LEVITATE_APPROVAL_SECRET"
        allowed_redirect_uri_prefixes = ["https://chatgpt.com/connector/oauth/"]
        scopes_supported = ["gateway:access"]
        default_scopes = ["gateway:access"]
        access_token_ttl_seconds = 900
        refresh_token_ttl_seconds = 2592000
        authorization_code_ttl_seconds = 300
        client_store_file = "state/oauth-clients.json"
        refresh_token_store_file = "state/oauth-refresh-tokens.json"

        [oauth.as.dcr]
        enabled = false

        [oauth.as.cimd]
        enabled = true
        allowed_client_id_prefixes = ["https://chatgpt.com/"]

        [oauth.as.keys]
        private_key_file = "state/oauth-private-key.pem"
        key_id = "kannabi-gateway-1"

        [oauth.as.rate_limits]
        window_seconds = 60
        registration = 10
        authorization = 30
        token = 60
        approval = 10

        [backends.kannabi]
        name = "kannabi"
        mcp_path = "/kannabi/mcp"

        [backends.kannabi.instructions]
        file = "/tmp/kannabi-instructions.md"

        [backends.kannabi.stdio]
        command = "node"
        args = ["/opt/kannabi-mcp/dist/server/mcp.js"]

        [backends.kannabi.env]
        NEO4J_URI = "$${NEO4J_URI}"
        NEO4J_USERNAME = "$${NEO4J_USERNAME}"
        NEO4J_PASSWORD = "$${NEO4J_PASSWORD}"
        TOML
        exec node dist/src/index.js --config /tmp/kannabi.toml
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:18788/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

networks:
  # Created by the main compose project; start it first.
  kannabi:
    external: true
    name: kannabi_default
