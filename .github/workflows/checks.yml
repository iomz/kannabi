name: checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The checks AGENTS.md requires for every application change.
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test
      - run: pnpm test:setup

  # Each suite runs against its own disposable Neo4j (and object storage where
  # it puts bytes through the photo routes); no shared database exists.
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Pull the images the harness starts before any suite runs, retrying, so
      # a slow registry on the runner fails here as a pull rather than midway
      # through the suites as a test failure.
      - name: Pull test images
        run: |
          for image in neo4j:5-community ghcr.io/achtungsoftware/alarik:1.0.0-beta-16; do
            for attempt in 1 2 3 4 5; do
              docker pull --quiet "$image" && break
              [ "$attempt" = 5 ] && exit 1
              sleep $((attempt * 15))
            done
          done
      - run: pnpm test:integration
